name: OpenCode AutoFix Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Clean up stale branches
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for branch in $(gh api repos/${{ github.repository }}/git/refs/heads --jq '.[].ref' | sed 's|refs/heads/||' | grep -E '^(opencode/|autofix/)' || echo ""); do
            PR_STATE=$(gh pr list --repo ${{ github.repository }} --head "$branch" --state all --json state --jq '.[0].state' 2>/dev/null || echo "")
            if [ "$PR_STATE" = "MERGED" ] || [ "$PR_STATE" = "CLOSED" ]; then
              echo "Deleting stale branch: $branch"
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$branch" --silent 2>/dev/null || true
            fi
          done

      - name: Fetch latest Sentry issue
        id: sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ISSUE_JSON=$(gh api \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://de.sentry.io/api/0/organizations/bikramgole/issues/?query=is:unresolved&limit=1&statsPeriod=14d" \
            --jq '.[0] // empty' 2>/dev/null || echo "")

          if [ -z "$ISSUE_JSON" ] || [ "$ISSUE_JSON" = "null" ]; then
            echo "No unresolved Sentry issues found."
            echo "has_issue=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          SHORT_ID=$(echo "$ISSUE_JSON" | jq -r '.shortId')
          TITLE=$(echo "$ISSUE_JSON" | jq -r '.title')
          ID=$(echo "$ISSUE_JSON" | jq -r '.id')
          echo "Found: $SHORT_ID -- $TITLE"
          echo "has_issue=true" >> $GITHUB_OUTPUT
          echo "issue_id=$SHORT_ID" >> $GITHUB_OUTPUT
          echo "sentry_numeric_id=$ID" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "$ISSUE_JSON" | jq -r '.metadata.value // .metadata.title // empty' > /tmp/sentry_error.txt

      - name: Fix with AI (direct API calls)
        id: fix
        if: steps.sentry.outputs.has_issue == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          ISSUE_ID="${{ steps.sentry.outputs.issue_id }}"
          TITLE="${{ steps.sentry.outputs.title }}"
          TS=$(date +%s)
          BRANCH="autofix/${ISSUE_ID}-${TS}"
          ERROR_MSG=$(cat /tmp/sentry_error.txt)
          FILE_LIST=$(git ls-files | head -100)

          git config user.name "opencode-autofix"
          git config user.email "opencode-autofix@users.noreply.github.com"
          git checkout -b "$BRANCH"

          echo '' | base64 -d > /tmp/autofix.py
          python3 /tmp/autofix.py "$ERROR_MSG" "$TITLE" "$FILE_LIST" || true

          CHANGED=$( { git diff --name-only HEAD && git status --porcelain; } 2>/dev/null | sort -u | grep -v '^$' | wc -l || echo "0")

          if [ "$CHANGED" = "0" ]; then
            echo "No changes made by any model."
            echo "pr_created=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git add -A
          git commit -m "fix: $TITLE [autofix]"
          git push origin "$BRANCH" 2>&1 || { echo "Push failed"; echo "pr_created=false" >> $GITHUB_OUTPUT; exit 0; }

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "fix: $TITLE [autofix]" \
            --body "Auto-fix for Sentry issue $ISSUE_ID.

          Error: $TITLE

          Auto-fixed by OpenCode pipeline." 2>&1 || true)

          if echo "$PR_URL" | grep -q "https://"; then
            PR_NUMBER=$(echo "$PR_URL" | grep -oP '\d+$' || echo "")
            if [ -n "$PR_NUMBER" ]; then
              gh pr merge --auto --squash "$PR_NUMBER" 2>&1 || true
              echo "Enabled auto-merge on PR #$PR_NUMBER"
              echo "pr_created=true" >> $GITHUB_OUTPUT
              echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
              echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            fi
          else
            echo "$PR_URL"
            echo "pr_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Wait for merge and cleanup
        if: steps.fix.outputs.pr_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_NUMBER="${{ steps.fix.outputs.pr_number }}"
          BRANCH="${{ steps.fix.outputs.branch }}"
          ISSUE_ID="${{ steps.sentry.outputs.issue_id }}"
          SENTRY_NUMERIC_ID="${{ steps.sentry.outputs.sentry_numeric_id }}"

          for i in $(seq 1 60); do
            STATE=$(gh pr view "$PR_NUMBER" --repo ${{ github.repository }} --json state,merged --jq 'if .merged then "MERGED" else .state end' 2>/dev/null || echo "")
            if [ "$STATE" = "MERGED" ]; then
              echo "PR #$PR_NUMBER merged!"
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" --silent 2>/dev/null && echo "Branch deleted" || true
              if [ -n "$SENTRY_NUMERIC_ID" ]; then
                gh api -X PUT \
                  -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
                  "https://de.sentry.io/api/0/issues/$SENTRY_NUMERIC_ID/" \
                  -F "status=resolved" --silent 2>/dev/null && echo "Sentry issue resolved" || true
              fi
              exit 0
            fi
            sleep 10
          done
          echo "PR did not merge within 10 minutes."
