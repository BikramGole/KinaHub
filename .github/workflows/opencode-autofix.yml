name: opencode-autofix

on:
  issues:
    types: [opened, reopened]

jobs:
  autofix:
    if: contains(github.event.issue.body, 'Sentry') || contains(github.event.issue.title, 'Error') || contains(github.event.issue.title, 'Exception') || contains(github.event.issue.body, 'sentry')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Configure git
        run: |
          git config --global user.email "opencode[bot]@users.noreply.github.com"
          git config --global user.name "opencode[bot]"

      - name: Install opencode
        run: |
          if ! command -v opencode &>/dev/null; then
            curl -fsSL https://opencode.ai/install | bash
          fi
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Fix with OpenCode Zen
        id: zen
        continue-on-error: true
        timeout-minutes: 10
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          opencode run -m opencode/deepseek-v4-flash-free --no-replay \
            "This Sentry error needs fixing in the codebase. Issue: ${{ github.event.issue.title }}. Details: ${{ github.event.issue.body }}. Find and fix the root cause." || true
          if [ -n "$(git status --porcelain)" ]; then
            echo "fixed=true" >> $GITHUB_OUTPUT
          fi

      - name: Fix with Gemini
        id: gemini
        if: steps.zen.outputs.fixed != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          opencode run -m google/gemini-2.5-flash --no-replay \
            "This Sentry error needs fixing in the codebase. Issue: ${{ github.event.issue.title }}. Details: ${{ github.event.issue.body }}. Find and fix the root cause." || true
          if [ -n "$(git status --porcelain)" ]; then
            echo "fixed=true" >> $GITHUB_OUTPUT
          fi

      - name: Fix with OpenRouter
        id: or
        if: steps.zen.outputs.fixed != 'true' && steps.gemini.outputs.fixed != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          opencode run -m deepseek/deepseek-v4-flash --no-replay \
            "This Sentry error needs fixing in the codebase. Issue: ${{ github.event.issue.title }}. Details: ${{ github.event.issue.body }}. Find and fix the root cause." || true
          if [ -n "$(git status --porcelain)" ]; then
            echo "fixed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR
        if: steps.zen.outputs.fixed == 'true' || steps.gemini.outputs.fixed == 'true' || steps.or.outputs.fixed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="opencode/autofix-${{ github.event.issue.number }}-$(date +%s)"
          git checkout -b "$BRANCH"
          git add .
          git commit -m "Auto-fix: ${{ github.event.issue.title }}"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "Auto-fix: ${{ github.event.issue.title }}" \
            --body "Automated fix for issue #${{ github.event.issue.number }}\n\nCloses #${{ github.event.issue.number }}")
          PR_NUMBER=$(echo "$PR_URL" | grep -oP '\d+$')
          gh pr merge --auto --squash "$PR_NUMBER" --subject "Auto-fix: ${{ github.event.issue.title }}"

      - name: Close issue after PR merges
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            PR_NUMBER=$(gh pr list --search "#${{ github.event.issue.number }}" --state merged --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
              gh issue close ${{ github.event.issue.number }} --comment "Auto-fixed by PR #$PR_NUMBER"
              exit 0
            fi
            sleep 10
          done
