name: opencode-autofix

on:
  issues:
    types: [opened]

jobs:
  autofix:
    if: contains(github.event.issue.body, 'Sentry') || contains(github.event.issue.title, 'Error') || contains(github.event.issue.title, 'Exception')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        with:
          model: google/gemini-2.5-flash
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            This issue was reported from Sentry error monitoring.
            Analyze the error described in this issue, find the root cause in the codebase,
            implement a fix, and open a pull request with the changes.
            If the issue lacks details, look at recent Sentry errors or check the codebase
            for related issues.

      - name: Enable auto-merge on created PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh issue view ${{ github.event.issue.number }} --json closedByPRs --jq '.closedByPRs[-1].number' 2>/dev/null || echo "")
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            gh pr merge --auto --squash "$PR_NUMBER" --subject "Auto-fix: $(gh issue view ${{ github.event.issue.number }} --json title --jq '.title' 2>/dev/null || echo 'fix')"
            echo "Auto-merge enabled on PR #$PR_NUMBER"
          else
            echo "No PR found to auto-merge"
          fi
