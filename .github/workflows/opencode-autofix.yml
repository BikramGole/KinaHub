name: OpenCode AutoFix Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Clean up stale branches
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for branch in $(gh api repos/${{ github.repository }}/git/refs/heads --jq '.[].ref' | sed 's|refs/heads/||' | grep -E '^(opencode/|autofix/)' || echo ""); do
            PR_STATE=$(gh pr list --repo ${{ github.repository }} --head "$branch" --state all --json state --jq '.[0].state' 2>/dev/null || echo "")
            if [ "$PR_STATE" = "MERGED" ] || [ "$PR_STATE" = "CLOSED" ]; then
              echo "Deleting stale branch: $branch"
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$branch" --silent 2>/dev/null || true
            fi
          done

      - name: Fetch latest Sentry issue
        id: sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ISSUE_JSON=$(gh api \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://de.sentry.io/api/0/organizations/bikramgole/issues/?query=is:unresolved&limit=1&statsPeriod=14d" \
            --jq '.[0] // empty' 2>/dev/null || echo "")

          if [ -z "$ISSUE_JSON" ] || [ "$ISSUE_JSON" = "null" ]; then
            echo "No unresolved Sentry issues found."
            echo "has_issue=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          SHORT_ID=$(echo "$ISSUE_JSON" | jq -r '.shortId')
          TITLE=$(echo "$ISSUE_JSON" | jq -r '.title')
          ID=$(echo "$ISSUE_JSON" | jq -r '.id')
          echo "Found: $SHORT_ID -- $TITLE"
          echo "has_issue=true" >> $GITHUB_OUTPUT
          echo "issue_id=$SHORT_ID" >> $GITHUB_OUTPUT
          echo "sentry_numeric_id=$ID" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "$ISSUE_JSON" | jq -r '.metadata.value // .metadata.title // empty' > /tmp/sentry_error.txt

      - name: Fix with AI (direct API calls)
        id: fix
        if: steps.sentry.outputs.has_issue == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          ISSUE_ID="${{ steps.sentry.outputs.issue_id }}"
          TITLE="${{ steps.sentry.outputs.title }}"
          TS=$(date +%s)
          BRANCH="autofix/${ISSUE_ID}-${TS}"
          ERROR_MSG=$(cat /tmp/sentry_error.txt)

          git config user.name "opencode-autofix"
          git config user.email "opencode-autofix@users.noreply.github.com"
          git checkout -b "$BRANCH"

          FILE_LIST=$(git ls-files | head -100)

          FIX_PROMPT="Fix this Sentry error in the codebase.
Error: $TITLE
Details: $ERROR_MSG

Repository contents:
$FILE_LIST

Output ONLY a JSON array of file changes. Each change must have:
- \"file\": relative file path
- \"content\": the COMPLETE new file content (the whole file, not just the diff)

Example:
[{\"file\": \"path/to/file.py\", \"content\": \"new content here\"}]

Make sure the JSON is valid and complete. Do NOT include any other text outside the JSON."

          apply_changes() {
            local response="$1"
            local content
            content=$(echo "$response" | jq -r '.choices[0].message.content // .candidates[0].content.parts[0].text // empty' 2>/dev/null)
            [ -z "$content" ] && return 1
            echo "$content" > /tmp/ai_changes.txt

            python3 -c "
import json, os, sys

with open('/tmp/ai_changes.txt') as f:
    raw = f.read()

raw = raw.strip()

start = raw.find('[')
end = raw.rfind(']') + 1
if start < 0 or end <= start:
    for marker in ['\`\`\`json', '\`\`\`']:
        if marker in raw:
            parts = raw.split(marker)
            for i, part in enumerate(parts):
                start = part.find('[')
                end = part.rfind(']') + 1
                if start >= 0 and end > start:
                    raw = part[start:end]
                    break
            else:
                continue
            break
    else:
        print('FAIL: No JSON array found')
        sys.exit(1)
else:
    raw = raw[start:end]

try:
    changes = json.loads(raw)
except json.JSONDecodeError as e:
    print(f'FAIL: JSON parse error: {e}')
    sys.exit(1)

if not isinstance(changes, list):
    changes = [changes]

count = 0
for c in changes:
    fp = c.get('file', '')
    content = c.get('content', '')
    if not fp or not content:
        continue
    d = os.path.dirname(fp)
    if d:
        os.makedirs(d, exist_ok=True)
    with open(fp, 'w') as f:
        f.write(content)
    count += 1
    print(f'Applied: {fp}')

if count == 0:
    print('FAIL: No valid file changes in JSON')
    sys.exit(1)
print(f'OK: {count} files changed')
" 2>&1
          }

          echo "=== TIER 1: OpenCode Zen (direct API) ==="
          T1_PAYLOAD=$(jq -n --arg prompt "$FIX_PROMPT" \
            '{"model": "deepseek-v4-flash-free", "messages": [{"role": "user", "content": $prompt}]}')
          ZEN_RESPONSE=$(curl -s -X POST "https://opencode.ai/zen/v1/chat/completions" \
            -H "Authorization: Bearer $OPENCODE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$T1_PAYLOAD" 2>&1 || echo "")
          echo "$ZEN_RESPONSE" | jq -r '.choices[0].message.content' 2>/dev/null | head -c 500
          echo ""
          apply_changes "$ZEN_RESPONSE" && echo "TIER 1 OK" || echo "TIER 1 FAILED"

          CHANGED=$( { git diff --name-only HEAD && git status --porcelain; } 2>/dev/null | sort -u | grep -v '^$' | wc -l || echo "0")

          if [ "$CHANGED" = "0" ]; then
            git checkout -- . 2>/dev/null; git clean -fd 2>/dev/null
            echo "=== TIER 2: Gemini (direct API) ==="
            T2_PAYLOAD=$(jq -n --arg prompt "$FIX_PROMPT" \
              '{"contents": [{"parts": [{"text": $prompt}]}]}')
            GEMINI_RESPONSE=$(curl -s -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-001:generateContent?key=$GOOGLE_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$T2_PAYLOAD" 2>&1 || echo "")
            echo "$GEMINI_RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null | head -c 500
            echo ""
            apply_changes "$GEMINI_RESPONSE" && echo "TIER 2 OK" || echo "TIER 2 FAILED"
          fi

          CHANGED=$( { git diff --name-only HEAD && git status --porcelain; } 2>/dev/null | sort -u | grep -v '^$' | wc -l || echo "0")

          if [ "$CHANGED" = "0" ]; then
            git checkout -- . 2>/dev/null; git clean -fd 2>/dev/null
            echo "=== TIER 3: OpenRouter (direct API) ==="
            T3_PAYLOAD=$(jq -n --arg prompt "$FIX_PROMPT" \
              '{"model": "openrouter/auto", "messages": [{"role": "user", "content": $prompt}]}')
            OR_RESPONSE=$(curl -s -X POST "https://openrouter.ai/api/v1/chat/completions" \
              -H "Authorization: Bearer $OPENROUTER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$T3_PAYLOAD" 2>&1 || echo "")
            echo "$OR_RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null | head -c 500
            echo ""
            apply_changes "$OR_RESPONSE" && echo "TIER 3 OK" || echo "TIER 3 FAILED"
          fi

          CHANGED=$( { git diff --name-only HEAD && git status --porcelain; } 2>/dev/null | sort -u | grep -v '^$' | wc -l || echo "0")

          if [ "$CHANGED" = "0" ]; then
            echo "No changes made by any model."
            echo "pr_created=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git add -A
          git commit -m "fix: $TITLE [autofix]"
          git push origin "$BRANCH" 2>&1 || { echo "Push failed"; echo "pr_created=false" >> $GITHUB_OUTPUT; exit 0; }

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "fix: $TITLE [autofix]" \
            --body "Auto-fix for Sentry issue $ISSUE_ID.

Error: $TITLE

Auto-fixed by OpenCode pipeline." 2>&1 || true)

          if echo "$PR_URL" | grep -q "https://"; then
            PR_NUMBER=$(echo "$PR_URL" | grep -oP '\d+$' || echo "")
            if [ -n "$PR_NUMBER" ]; then
              gh pr merge --auto --squash "$PR_NUMBER" 2>&1 || true
              echo "Enabled auto-merge on PR #$PR_NUMBER"
              echo "pr_created=true" >> $GITHUB_OUTPUT
              echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
              echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            fi
          else
            echo "$PR_URL"
            echo "pr_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Wait for merge and cleanup
        if: steps.fix.outputs.pr_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_NUMBER="${{ steps.fix.outputs.pr_number }}"
          BRANCH="${{ steps.fix.outputs.branch }}"
          ISSUE_ID="${{ steps.sentry.outputs.issue_id }}"
          SENTRY_NUMERIC_ID="${{ steps.sentry.outputs.sentry_numeric_id }}"

          for i in $(seq 1 60); do
            STATE=$(gh pr view "$PR_NUMBER" --repo ${{ github.repository }} --json state,merged --jq 'if .merged then "MERGED" else .state end' 2>/dev/null || echo "")
            if [ "$STATE" = "MERGED" ]; then
              echo "PR #$PR_NUMBER merged!"
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" --silent 2>/dev/null && echo "Branch deleted" || true
              if [ -n "$SENTRY_NUMERIC_ID" ]; then
                gh api -X PUT \
                  -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
                  "https://de.sentry.io/api/0/issues/$SENTRY_NUMERIC_ID/" \
                  -F "status=resolved" --silent 2>/dev/null && echo "Sentry issue resolved" || true
              fi
              exit 0
            fi
            sleep 10
          done
          echo "PR did not merge within 10 minutes."
