name: opencode-autofix

on:
  issues:
    types: [opened]

jobs:
  autofix:
    if: contains(github.event.issue.body, 'Sentry') || contains(github.event.issue.title, 'Error') || contains(github.event.issue.labels.*.name, 'sentry')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        with:
          model: groq/llama-3.3-70b-versatile
          prompt: |
            This issue was reported from Sentry error monitoring.
            Analyze the error, find the root cause in the codebase, implement a fix,
            and open a pull request with the changes.
          github_token: ${{ secrets.GITHUB_TOKEN }}
