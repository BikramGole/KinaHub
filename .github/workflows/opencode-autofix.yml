name: opencode-autofix

on:
  issues:
    types: [opened, reopened]

jobs:
  autofix:
    if: contains(github.event.issue.body, 'Sentry') || contains(github.event.issue.title, 'Error') || contains(github.event.issue.title, 'Exception') || contains(github.event.issue.body, 'sentry')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Configure git
        run: |
          git config --global user.email "opencode[bot]@users.noreply.github.com"
          git config --global user.name "opencode[bot]"

      - name: Run OpenCode (OpenCode Zen)
        id: zen
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            This issue was reported from Sentry error monitoring.
            Analyze the error described in this issue, find the root cause in the codebase,
            implement a fix, and open a pull request with the changes.
            If the issue lacks details, look at recent Sentry errors or check the codebase
            for related issues.

      - name: Run OpenCode (Gemini fallback)
        id: gemini
        if: steps.zen.outcome == 'failure'
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: google/gemini-2.5-flash
          use_github_token: true
          prompt: |
            This issue was reported from Sentry error monitoring.
            Analyze the error described in this issue, find the root cause in the codebase,
            implement a fix, and open a pull request with the changes.
            If the issue lacks details, look at recent Sentry errors or check the codebase
            for related issues.

      - name: Run OpenCode (Groq fallback)
        id: groq
        if: steps.zen.outcome == 'failure' && steps.gemini.outcome == 'failure'
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: groq/llama-3.3-70b-versatile
          use_github_token: true
          prompt: |
            This issue was reported from Sentry error monitoring.
            Analyze the error described in this issue, find the root cause in the codebase,
            implement a fix, and open a pull request with the changes.
            If the issue lacks details, look at recent Sentry errors or check the codebase
            for related issues.

      - name: Run OpenCode (OpenRouter fallback)
        id: or
        if: steps.zen.outcome == 'failure' && steps.gemini.outcome == 'failure' && steps.groq.outcome == 'failure'
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openrouter/auto
          use_github_token: true
          prompt: |
            This issue was reported from Sentry error monitoring.
            Analyze the error described in this issue, find the root cause in the codebase,
            implement a fix, and open a pull request with the changes.
            If the issue lacks details, look at recent Sentry errors or check the codebase
            for related issues.

      - name: Enable auto-merge on created PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --search "#${{ github.event.issue.number }}" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            gh pr merge --auto --squash "$PR_NUMBER" --subject "Auto-fix: ${{ github.event.issue.title }}"
            echo "Auto-merge enabled on PR #$PR_NUMBER"
          else
            echo "No PR found for issue #${{ github.event.issue.number }}"
          fi

      - name: Close issue after PR merges
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            PR_NUMBER=$(gh pr list --search "#${{ github.event.issue.number }}" --state merged --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
              gh issue close ${{ github.event.issue.number }} --comment "Auto-fixed by PR #$PR_NUMBER"
              echo "Closed issue #${{ github.event.issue.number }} (fixed by PR #$PR_NUMBER)"
              exit 0
            fi
            sleep 10
          done
          echo "PR did not merge within 10 minutes. Issue #${{ github.event.issue.number }} remains open."
