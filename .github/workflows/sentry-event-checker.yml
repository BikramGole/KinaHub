name: Sentry Event Checker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  check-sentry:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Check Sentry for unresolved issues
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}

          set -e
        run: |
          PROJECT_SLUG=$(echo "${{ github.repository }}" | cut -d/ -f2 | tr "[:upper:]" "[:lower:]" | sed "s/\./-/g")
          set -e

          NOISE_PATTERNS=(
            "WORKER TIMEOUT"
            "sent SIGKILL"
            "out of memory"
            "SystemExit"
          )

          ISSUES=$(gh api \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://de.sentry.io/api/0/organizations/bikramgole/issues/?query=is:unresolved%20project:${PROJECT_SLUG}&limit=5&statsPeriod=14d" \
            --jq '.[] // empty' 2>/dev/null || echo "")

          if [ -z "$ISSUES" ]; then
            echo "No unresolved issues found."
            exit 0
          fi

          echo "$ISSUES" | jq -c '.' | while IFS= read -r issue; do
            SHORT_ID=$(echo "$issue" | jq -r '.shortId // "unknown"')
            TITLE=$(echo "$issue" | jq -r '.title // ""')
            ID=$(echo "$issue" | jq -r '.id // ""')

            IS_NOISE=false
            for pattern in "${NOISE_PATTERNS[@]}"; do
              if echo "$TITLE" | grep -qiE "$pattern"; then
                IS_NOISE=true
                break
              fi
            done

            if [ "$IS_NOISE" = true ]; then
              echo "Ignoring noise: $SHORT_ID — $TITLE"
              gh api \
                -X PUT \
                -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
                "https://de.sentry.io/api/0/issues/$ID/" \
                -F "status=ignored" \
                -F "ignoreCount=999999" 2>/dev/null || true
              continue
            fi

            EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
              --json title --jq ".[] | select(.title | contains(\"$SHORT_ID\")) | .title" | head -1)

            if [ -n "$EXISTING" ]; then
              echo "Issue already exists for $SHORT_ID, skipping."
              continue
            fi

            gh issue create \
              --repo "${{ github.repository }}" \
              --title "Sentry: $SHORT_ID — $TITLE" \
              --body "Sentry issue **$SHORT_ID** was detected.

          **Error:** $TITLE

          **Sentry ID:** $ID

          This issue was automatically created by the Sentry Event Checker workflow.

          **Next step:** The OpenCode AutoFix pipeline will attempt to fix this automatically." 2>&1 || true

            echo "Created issue for $SHORT_ID"
          done

          # Close GitHub issues for Sentry issues that are now resolved
          PROJECT_SLUG=$(echo "${{ github.repository }}" | cut -d/ -f2 | tr '[:upper:]' '[:lower:]' | sed 's/\./-/g')
          OPEN_ISSUES=$(gh issue list --repo "${{ github.repository }}" --state open --json title,number --jq '.[] | {number, title}' 2>/dev/null || echo "")
          if [ -n "$OPEN_ISSUES" ]; then
            echo "$OPEN_ISSUES" | jq -c '.' | while IFS= read -r issue; do
              NUM=$(echo "$issue" | jq -r '.number')
              TITLE=$(echo "$issue" | jq -r '.title')
              SHORT_ID=$(echo "$TITLE" | grep -oP 'Sentry: \K[A-Z]+-[A-Z0-9]+' || echo "")
              if [ -z "$SHORT_ID" ]; then continue; fi
              SENTRY_STATUS=$(gh api -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" "https://de.sentry.io/api/0/organizations/bikramgole/issues/?query=$SHORT_ID&limit=1&statsPeriod=14d" --jq '.[0].status // "resolved"' 2>/dev/null || echo "resolved")
              if [ "$SENTRY_STATUS" = "resolved" ]; then
                gh issue close "$NUM" --repo "${{ github.repository }}" --comment "Auto-closed: Sentry issue $SHORT_ID is no longer unresolved." 2>/dev/null && echo "Closed #$NUM ($SHORT_ID)" || true
              fi
            done
          fi
